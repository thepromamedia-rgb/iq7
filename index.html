function startRazorpayWatch(){
 if(rzpWatch)return;
 rzpWatch=setInterval(async()=>{
  try{
   const u=me();
   if(u){const pending=myPays(u).find(x=>x.razorpayOrderId&&['Pending Verification','Cancelled','Failed'].includes(x.status));if(pending){try{await api('razorpay/status',{razorpay_order_id:pending.razorpayOrderId})}catch(e){}}}
   await sync();
   if(!u||unlocked(me())){clearInterval(rzpWatch);rzpWatch=null;if(tab==='course')render();}

  }catch(e){}
 },2500);
 setTimeout(()=>{if(rzpWatch){clearInterval(rzpWatch);rzpWatch=null}},120000);
}

function adQrPick(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,420/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);adQr=c.toDataURL('image/png');adQrPrev()};im.onerror=()=>toast('Could not read this image','er');im.src=r.result};r.readAsDataURL(f)}

async function adGenerateQuestions(){const btn=$('#adGenBtn');try{const urls=[0,1,2].map(i=>$('#v'+i+'u').value.trim());if(urls.some(x=>!/^https?:\/\//i.test(x)))throw new Error('Pehle teeno task links add karo.');if(btn){btn.disabled=true;btn.textContent='Generating...'}const out=await api('admin/generate-questions',{urls});(out.questions||[]).forEach((q,i)=>{if(i>1)return;$('#q'+i+'q').value=q.q;for(let k=0;k<3;k++)$('#q'+i+'o'+k).value=q.options[k]||'';const radio=document.querySelector('input[name="q'+i+'r"][value="'+q.answer+'"]');if(radio)radio.checked=true});toast('2 questions generated. Review and edit before publishing.','ok')}catch(e){fail(e)}finally{if(btn){btn.disabled=false;btn.textContent='Optional: Generate AI Questions'}}}
async function adSave(){const date=$('#dd').value;try{const videos=[];for(let i=0;i<3;i++){const link=$('#v'+i+'u').value.trim();if(!/^https?:\/\//.test(link))throw new Error('Link '+(i+1)+' must be a valid http/https link');videos.push({title:$('#v'+i+'t').value.trim()||'Join Now',url:link})}const questions=[0,1].map(i=>({q:$('#q'+i+'q').value.trim(),options:[0,1,2].map(k=>$('#q'+i+'o'+k).value.trim()),answer:+(document.querySelector('input[name="q'+i+'r"]:checked')||{value:0}).value}));await api('admin/daily',{date,videos,questions});await sync();adDate=date;render();toast('Saved for '+date,'ok')}catch(e){fail(e)}}
async function adDel(){const date=$('#dd').value;if(!confirm('Delete content for '+date+'?'))return;try{await api('admin/dailydel',{date});await sync();adDate=date;render();toast('Deleted','ok')}catch(e){fail(e)}}

<script>
/* QR Add button fix: clicking "+ Add QR" opens a fresh QR slot for entry. */
(function(){
 if(window.__addQrFixInstalled)return;
 window.__addQrFixInstalled=true;

 function findAddQrButton(){
   var els=document.querySelectorAll('button,a,[role="button"]');
   for(var i=0;i<els.length;i++){
     var t=(els[i].textContent||'').trim().replace(/\s+/g,' ');
     if(/^\+?\s*add\s*qr$/i.test(t) || /add\s*qr/i.test(t)) return els[i];
   }
   return null;
 }

 document.addEventListener('click',function(e){
   var b=findAddQrButton();
   if(!b || e.target===b || b.contains(e.target)) return;

   /* Do not interfere with the app's existing QR controls. */
 },true);

 window.__openNewQrSlot=function(){
   var b=findAddQrButton();
   if(b) b.click();
 };
})();
</script>


<script>
(()=>{
 let deferredPrompt=null;
 const standalone=()=>window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;
 function addInstallButton(){
  if(standalone()||document.getElementById('referkro-install-app')) return;
  const b=document.createElement('button'); b.id='referkro-install-app'; b.type='button'; b.textContent='⬇ Download App';
  b.setAttribute('aria-label','Install ReferKro app');
  b.style.cssText='position:fixed;right:14px;bottom:calc(145px + env(safe-area-inset-bottom,0px));z-index:9999;border:0;border-radius:999px;padding:12px 17px;background:#f97316;color:#fff;font:700 14px system-ui;box-shadow:0 4px 14px #0003;cursor:pointer';
  b.addEventListener('click',async()=>{
   if(deferredPrompt){deferredPrompt.prompt(); const choice=await deferredPrompt.userChoice; if(choice&&choice.outcome==='accepted') b.remove(); deferredPrompt=null; return;}
   const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
   alert(isIOS?'Install karne ke liye Share button dabayein, phir “Add to Home Screen” chunein.':'Browser menu (⋮) kholein aur “Install app” ya “Add to Home screen” chunein.');
  });
  document.body.appendChild(b);
 }
 window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;addInstallButton();});
 window.addEventListener('appinstalled',()=>{const b=document.getElementById('referkro-install-app');if(b)b.remove();});
 if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',addInstallButton); else addInstallButton();
 if('serviceWorker' in navigator && location.protocol==='https:') window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
})();
</script>
