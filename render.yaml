services:
  - type: web
    name: iq63
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: PAYMENT_UPI_ID
        sync: false
      - key: PAYMENT_NAME
        value: IQ63
